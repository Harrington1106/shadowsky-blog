# ShadowQuake v2 —— 单机 Docker 编排(方案 A)
# web 常驻(:3000,nginx 反代);jobs 按需(cron 触发 `run --rm`,不常驻,省内存 C1)。
# 密钥/配置走 .env(不进 git):AUTH_SECRET / ADMIN_PASSWORD / BANGUMI_TOKEN 等。

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_PATH: /app/db/shadowquake.db
      POSTS_DIR: /app/content/posts
      AI_DAILY_DIR: /app/content/ai-daily
    ports:
      - "127.0.0.1:3000:3000"   # 仅本机,nginx 反代
    volumes:
      - ./data/db:/app/db               # SQLite 持久化
      - ./content:/app/content          # 文章 md + AI 日报(发文即时可见 C5)
      - ./data/uploads:/app/public/uploads
    mem_limit: 768m                      # C1:硬限额,防吃爆内存
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/notice').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3

  jobs:
    build:
      context: ./web
      dockerfile: Dockerfile.jobs
    profiles: ["jobs"]                   # 默认不启动;用 `run --rm` 触发
    env_file: .env
    environment:
      DB_PATH: /app/db/shadowquake.db
      AI_DAILY_DIR: /app/content/ai-daily
    volumes:
      - ./data/db:/app/db
      - ./content:/app/content
