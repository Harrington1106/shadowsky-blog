server {
    listen 80;
    listen 4443 ssl http2;
    server_name shadowquake.top www.shadowquake.top test.shadowquake.top;

    add_header Content-Security-Policy "upgrade-insecure-requests" always;

    # 301 的 Location 发相对路径。默认 on 时 nginx 按自己看到的 scheme 拼绝对地址,
    # 而 CF/中转机是以 http 回源的 → 用户被跳到 http:// 再被顶回 https,白白多一跳。
    absolute_redirect off;
    # Let's Encrypt 公开可信证书(2026-07-26 起)。
    # 原先用的是 Cloudflare Origin CA 证书,只被 CF 信任 —— 其他 CDN(如 EdgeOne)
    # 回源时会因 unknown CA 校验失败(525)。换成 LE 后任何上游都能正常回源。
    ssl_certificate     /etc/letsencrypt/live/shadowquake-wild/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shadowquake-wild/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 遗留静态目录(仅剩 gnz48 页 + 它的订阅文件;AI 日报归档已于 2026-08-01 退役)
    root /www/wwwroot/legacy-static;

    # Let's Encrypt HTTP-01 验证(证书自动续签需要,长期保留)
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    # ── 遗留 favicon(v2 自己有 /img/favicon256.png,这个只兜浏览器默认请求)──
    #    /css/ /js/ /public/ 的 location 已于 2026-08-01 删除:它们只服务
    #    ai-daily 归档页,归档退役后无引用方,对应目录也已从 legacy-static 删掉。
    #    现在这些路径落到 location / → v2 返回 404,符合预期。
    location = /favicon.ico { try_files $uri =404; }

    # ── 遗留 GNZ48 日历页 + 订阅文件(v2 未迁移,保持原样)──────────────
    location = /gnz48.html { try_files $uri =404; }
    location ~ ^/(app|data)\.js$ { expires 1h; try_files $uri =404; }
    location ~ ^/(team-g\.ics|schedule\.json)$ {
        default_type text/calendar;
        add_header Access-Control-Allow-Origin * always;
        location ~ \.json$ { default_type application/json; }
        try_files $uri =404;
    }

    # ── 旧 AI 日报静态归档页已退役(2026-08-01)→ 全部 301 到 v2 ──────────
    #    归档正文已迁进 content/ai-daily,由 /blog#aidaily 列表 + /post?ai= 阅读页接管。
    #    ⚠ 三个语法坑:catch-all 必须用普通前缀 location /ai-daily/ 而非 ^~
    #      (^~ 命中后 nginx 跳过正则,按日期跳转那条就永远轮不到);正则里的 {n}
    #      会被当成配置块括号,必须整条加引号;含 # 的跳转目标同样要加引号,
    #      否则 # 之后被当成注释,连结尾分号都被吃掉。
    location = /ai-daily  { return 301 "/blog#aidaily"; }
    location = /ai-daily/ { return 301 "/blog#aidaily"; }
    location ~ "^/ai-daily/(\d{4}-\d{2}-\d{2})\.html$" { return 301 /post?ai=$1; }
    location /ai-daily/ { return 301 "/blog#aidaily"; }

    # ── 旧 .html 链接 → v2 无后缀路由(保历史书签/外链不断)──────────────
    location = /index.html     { return 301 /; }
    location = /blog.html      { return 301 /blog; }
    location = /post.html      { return 301 /post$is_args$args; }
    location = /about.html     { return 301 /about; }
    location = /moments.html   { return 301 /moments; }
    location = /bookmarks.html { return 301 /bookmarks; }
    location = /rss.html       { return 301 /rss; }
    location = /acg.html       { return 301 /acg; }
    location = /anime.html     { return 301 /anime; }
    location = /manga.html     { return 301 /manga; }
    location = /edits.html     { return 301 /edits; }

    # ── 其余全部 → v2 standalone(页面 + /api + /_next + /uploads + /admin)──
    location / {
        # v2 自己做缓存(Next 预渲染 + s-maxage),nginx 再缓一层会导致部署后仍发旧 HTML,
        # 且会缓存 /api 与 /admin 响应 —— 这里必须关掉全局 proxy_cache cache_one
        proxy_cache off;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
