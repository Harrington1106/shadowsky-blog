server {
    listen 80;
    listen 4443 ssl http2;
    server_name shadowquake.top www.shadowquake.top;

    add_header Content-Security-Policy "upgrade-insecure-requests" always;
    ssl_certificate     /etc/nginx/cloudflare/shadowquake.top.pem;
    ssl_certificate_key /etc/nginx/cloudflare/shadowquake.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 旧站根目录(仍保留,供遗留 gnz48 / ai-daily / 静态资源使用,也是回滚素材)
    root /www/wwwroot/47.118.28.27;

    # ── 遗留静态资源(gnz48/ai-daily 页面仍引用旧 css/js/img)────────────
    location ^~ /css/     { expires 1h; try_files $uri =404; }
    location ^~ /js/      { expires 1h; try_files $uri =404; }
    location ^~ /public/  { expires 1h; try_files $uri =404; }
    location ^~ /img/legacy/ { expires 1h; try_files $uri =404; }
    location = /favicon.ico { try_files $uri =404; }

    # ── 遗留 GNZ48 日历页 + 订阅文件(v2 未迁移,保持原样)──────────────
    location = /gnz48.html { try_files $uri =404; }
    location ~ ^/(team-g\.ics|schedule\.json)$ {
        default_type text/calendar;
        add_header Access-Control-Allow-Origin * always;
        location ~ \.json$ { default_type application/json; }
        try_files $uri =404;
    }

    # ── 遗留 AI 日报静态归档页(旧 /ai-daily/*.html;v2 用 /blog#aidaily + /post?ai=)──
    location ^~ /ai-daily/ { try_files $uri =404; }

    # ── 旧 .html 链接 → v2 无后缀路由(保历史书签/外链不断)──────────────
    location = /index.html     { return 301 /; }
    location = /blog.html      { return 301 /blog; }
    location = /post.html      { return 301 /post$is_args$args; }
    location = /about.html     { return 301 /about; }
    location = /moments.html   { return 301 /moments; }
    location = /bookmarks.html { return 301 /bookmarks; }
    location = /rss.html       { return 301 /rss; }
    location = /acg.html       { return 301 /acg; }
    location = /anime.html     { return 301 /anime; }
    location = /manga.html     { return 301 /manga; }
    location = /edits.html     { return 301 /edits; }

    # ── 其余全部 → v2 standalone(页面 + /api + /_next + /uploads + /admin)──
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
