server {
    listen 80;
    listen 4443 ssl http2;
    server_name shadowquake.top www.shadowquake.top;
    error_page 404 /404.html;

    # 自动升级 HTTP→HTTPS, 修复备案 iframe 等混合内容警告
    add_header Content-Security-Policy "upgrade-insecure-requests" always;

    ssl_certificate     /etc/nginx/cloudflare/shadowquake.top.pem;
    ssl_certificate_key /etc/nginx/cloudflare/shadowquake.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /www/wwwroot/47.118.28.27;

    # ===== Static assets: 1h cache, must revalidate (配合版本号) =====
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header Vary "Accept-Encoding";
        try_files $uri =404;
    }

    # ===== HTML: no-store — 禁止 CDN/浏览器缓存 =====
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Vary "Accept-Encoding";
        try_files $uri =404;
    }

    # ===== JSON data files =====
    location /public/data/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # ===== Root/homepage (index.html): no-store =====
    location = / {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Vary "Accept-Encoding";
        try_files /index.html =404;
    }

    # ===== PHP API =====
    location ~ ^/api/.*\.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
    }

    # ===== GNZ48 Calendar .ics subscription =====
    # 处理根目录的 calendar 文件
    location ~ ^/(team-g\.ics|schedule\.json)$ {
        default_type text/calendar;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;

        # schedule.json 需要 application/json 类型
        location ~ \.json$ {
            default_type application/json;
        }

        try_files $uri =404;
    }

    # ===== Node.js backend (admin, API, fallback) =====
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_intercept_errors on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
